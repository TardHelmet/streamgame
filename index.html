<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Swoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
  :root{
    --gold:#FFC848; --coral:#FF7A45; --foam:#EAF7FA; --ink:#0C2231;
    --lagoon:#1E7FA0; --deepsea:#0B3550;
    --glass:rgba(10,34,49,.38); --glass-line:rgba(234,247,250,.22);
    --disp:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
    --body:'Schibsted Grotesk',ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    overflow:hidden;background:var(--deepsea);color:var(--foam);
    font-family:var(--body);touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease}
  #hud.on{opacity:1}
  #topbar{
    position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;
    justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 0;
  }
  .corner{display:flex;gap:8px;align-items:center;min-width:118px}
  #corner-r{justify-content:flex-end;flex-wrap:wrap}
  #dist{
    text-align:center;font-family:var(--disp);line-height:1;
    text-shadow:0 2px 14px rgba(6,24,36,.55);
  }
  #dist-n{font-size:clamp(34px,6.4vw,54px);font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  #dist .unit{font-size:.42em;font-weight:600;opacity:.85;margin-left:.18em;letter-spacing:.12em}
  #speedwrap{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:7px}
  #speedbar{width:132px;height:5px;border-radius:3px;background:rgba(10,34,49,.45);
    outline:1px solid var(--glass-line);overflow:hidden}
  #speedfill{display:block;height:100%;width:0%;border-radius:3px;
    background:linear-gradient(90deg,var(--foam),var(--gold));transition:width .12s linear}
  #speed-n{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.08em;
    opacity:.92;font-variant-numeric:tabular-nums;text-shadow:0 1px 8px rgba(6,24,36,.6)}
  .chip{
    display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;
    background:var(--glass);outline:1px solid var(--glass-line);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.09em;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .chip svg{display:block}
  .chip b{font-weight:700;font-size:13px}
  button.ctl{
    pointer-events:auto;cursor:pointer;width:38px;height:38px;border-radius:10px;border:0;
    background:var(--glass);outline:1px solid var(--glass-line);color:var(--foam);
    display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  button.ctl:hover{background:rgba(10,34,49,.55)}
  button.ctl:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  button.ctl svg{display:block}

  /* toast + hint + popups */
  #toast{
    position:absolute;top:22%;left:50%;transform:translateX(-50%) scale(.92);
    font-family:var(--disp);font-weight:700;font-size:clamp(22px,4.6vw,40px);letter-spacing:.14em;
    color:var(--gold);text-shadow:0 2px 18px rgba(6,24,36,.6);opacity:0;white-space:nowrap;
  }
  #toast.show{animation:toast 1.7s ease forwards}
  @keyframes toast{
    0%{opacity:0;transform:translateX(-50%) scale(.92)}
    12%{opacity:1;transform:translateX(-50%) scale(1)}
    78%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.03)}
  }
  #hint{
    position:absolute;bottom:16%;left:50%;transform:translateX(-50%);
    font-family:var(--body);font-weight:500;font-size:clamp(14px,2.4vw,19px);letter-spacing:.04em;
    color:var(--foam);background:var(--glass);outline:1px solid var(--glass-line);
    padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .4s ease;white-space:nowrap;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  #hint.show{opacity:1}
  #hint b{color:var(--gold);font-family:var(--disp);letter-spacing:.1em}

  /* ---------- title ---------- */
  #title{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;pointer-events:none;text-align:center;
    transition:opacity .6s ease;padding:0 18px;
  }
  #title.off{opacity:0}
  #wordmark{
    font-family:var(--disp);font-weight:700;font-size:clamp(64px,16vw,150px);line-height:.94;
    letter-spacing:.06em;margin-left:.06em;
    background:linear-gradient(178deg,#FFFFFF 18%,var(--foam) 42%,var(--gold) 88%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 26px rgba(6,24,36,.5));
  }
  #tagline{
    font-family:var(--disp);font-weight:600;font-size:clamp(13px,2.6vw,18px);
    letter-spacing:.34em;margin-left:.34em;text-transform:uppercase;color:var(--foam);
    text-shadow:0 1px 12px rgba(6,24,36,.65);
  }
  #howto{
    max-width:34em;font-size:clamp(13px,2.3vw,16px);line-height:1.55;color:var(--foam);
    opacity:.92;text-shadow:0 1px 10px rgba(6,24,36,.7);text-wrap:balance;
  }
  #titlebest{
    font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.22em;color:var(--gold);
    text-shadow:0 1px 10px rgba(6,24,36,.7);min-height:1em;
  }
  #cta{
    margin-top:10px;font-family:var(--disp);font-weight:700;letter-spacing:.26em;margin-left:.26em;
    font-size:clamp(15px,3vw,21px);color:var(--ink);background:var(--gold);
    padding:13px 26px;border-radius:13px;box-shadow:0 6px 30px rgba(255,200,72,.35);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @media (prefers-reduced-motion:reduce){
    #cta{animation:none}
    #toast.show{animation-duration:.01s;opacity:1}
  }
  @media (max-width:620px){
    .corner{min-width:0}
    #corner-r{position:absolute;top:calc(58px + env(safe-area-inset-top));right:10px;
      flex-direction:column;align-items:flex-end;gap:6px}
    .chip{padding:5px 8px;font-size:11px}
    #speedbar{width:92px}
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud">
  <div id="topbar">
    <div class="corner" id="corner-l">
      <button class="ctl" id="btn-mute" aria-label="Toggle sound">
        <svg id="ic-snd" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/>
          <path class="snd-on" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="snd-on" d="M18 6a8.5 8.5 0 0 1 0 12"/>
          <g class="snd-off" style="display:none"><path d="M16 9l5 6M21 9l-5 6"/></g>
        </svg>
      </button>
      <button class="ctl" id="btn-restart" aria-label="Restart flight">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
        </svg>
      </button>
    </div>
    <div id="dist"><span id="dist-n">0</span><span class="unit">M</span>
      <div id="speedwrap"><span id="speedbar"><i id="speedfill"></i></span><span id="speed-n">0 km/h</span></div>
    </div>
    <div class="corner" id="corner-r">
      <div class="chip" id="chip-best">BEST&nbsp;<b id="best-n">—</b></div>
      <div class="chip" title="Rings">
        <svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#FFC848" stroke-width="2.6"/></svg>
        <b id="ring-n">0</b>
      </div>
      <div class="chip" title="Fish">
        <svg width="16" height="12" viewBox="0 0 18 12" aria-hidden="true"><path d="M1 6l5-5v3.2C9.5 1.6 14 2.6 17 6c-3 3.4-7.5 4.4-11 1.8V11z" fill="#7FD8E8"/></svg>
        <b id="fish-n">0</b>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <div id="hint"></div>
</div>

<div id="title">
  <div id="wordmark">SWOOP</div>
  <div id="tagline">Flap &middot; Dive &middot; Swoop</div>
  <div id="howto">You are a gannet. <strong>Hold</strong> to flap and pull up, <strong>release</strong> to dive.
    Pierce the sea at speed, swoop through the deep, and launch back out faster — over and over, as far as you can.</div>
  <div id="titlebest"></div>
  <div id="cta">HOLD TO FLY</div>
</div>

<script>
'use strict';
/* ============================================================
   SWOOP — a polygonal momentum-flight toy.
   Custom 3D: perspective projection + painter-sorted flat-shaded
   triangles on a 2D canvas. No dependencies.
   ============================================================ */

// ---------- tiny math ----------
const TAU = Math.PI*2;
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= t=> t*t*(3-2*t);
function hash(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function norm3(v){ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

// ---------- canvas ----------
const cv = document.getElementById('view');
const ctx = cv.getContext('2d');
let W=0,H=0,W2=0,H2=0,DPR=1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = cv.width  = Math.floor(innerWidth*DPR);
  H = cv.height = Math.floor(innerHeight*DPR);
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  W2=W/2; H2=H/2;
}
addEventListener('resize', resize); resize();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- config ----------
const CFG = {
  g: 23,
  flapVy: 5.6, flapVx: 1.1, flapCd: 0.165,
  airDrag: 0.0021, waterDrag: 0.0040, depthDrag: 0.045,
  kick: 16, kickMax: 47, buoy: 7.0,
  turnWaterUp: 2.5, turnWaterDn: 1.5, turnAirUp: 1.12, turnAirDn: 0.6,
  maxAir: 64, minCruise: 10.5,
  entryKeep: 0.972, exitBoost: 1.05,
  skipAngle: 0.24, skipSpeed: 21,
  floorY: -25,
  camBack: 12.5, camUp: 3.4,
};

// ---------- palettes (day → sunset → night → dawn) ----------
const rgb = h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const PALS = [
  { skyTop:rgb('#3E97CF'), skyHor:rgb('#C4EAF1'), seaHi:rgb('#2E8FB0'), seaLo:rgb('#9CD4DE'),
    fog:rgb('#C4EAF1'), sun:rgb('#FFF3C4'), glint:rgb('#FFEFB0'), cloud:rgb('#FFFFFF'),
    uwTop:rgb('#0E5E86'), uwBot:rgb('#03182A'), sand:rgb('#C9B98A'), surfB:rgb('#8FE0EA'),
    el:0.85, starA:0, amb:0.58 },
  { skyTop:rgb('#4E549E'), skyHor:rgb('#FFB36B'), seaHi:rgb('#2A6486'), seaLo:rgb('#E8A15F'),
    fog:rgb('#F2B379'), sun:rgb('#FF8A3C'), glint:rgb('#FFC27E'), cloud:rgb('#FFD9B8'),
    uwTop:rgb('#0D4A6E'), uwBot:rgb('#041423'), sand:rgb('#B9A57C'), surfB:rgb('#F0B87E'),
    el:0.10, starA:0.15, amb:0.52 },
  { skyTop:rgb('#070F26'), skyHor:rgb('#14284A'), seaHi:rgb('#0C2A44'), seaLo:rgb('#1B355C'),
    fog:rgb('#14284A'), sun:rgb('#DCE8FF'), glint:rgb('#BFD5F2'), cloud:rgb('#22355B'),
    uwTop:rgb('#062038'), uwBot:rgb('#010A14'), sand:rgb('#5E6472'), surfB:rgb('#3E6E96'),
    el:-0.35, starA:1, amb:0.38 },
  { skyTop:rgb('#7A6FB8'), skyHor:rgb('#FFD1A6'), seaHi:rgb('#276E90'), seaLo:rgb('#EDC49B'),
    fog:rgb('#EFC8A2'), sun:rgb('#FFB05E'), glint:rgb('#FFD9A0'), cloud:rgb('#F6DFC8'),
    uwTop:rgb('#0E567C'), uwBot:rgb('#041827'), sand:rgb('#C2B085'), surfB:rgb('#B8DCC8'),
    el:0.12, starA:0.3, amb:0.5 },
];
const PAL = {};   // current, lerped
function mixPal(a,b,t){
  for(const k in a){
    if(Array.isArray(a[k])) PAL[k]=[lerp(a[k][0],b[k][0],t)|0, lerp(a[k][1],b[k][1],t)|0, lerp(a[k][2],b[k][2],t)|0];
    else PAL[k]=lerp(a[k],b[k],t);
  }
}
function css(c,al){ return al===undefined? `rgb(${c[0]|0},${c[1]|0},${c[2]|0})` : `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${al})`; }
function mix(a,b,t){ return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }
function shadeCol(c,s){ return [c[0]*s, c[1]*s, c[2]*s]; }

// ---------- waves ----------
let time=0;
function waveH(x,z){
  return 0.82*Math.sin(0.052*x + 1.25*time)
       + 0.48*Math.sin(0.118*x - 0.85*time + z*0.06)
       + 0.34*Math.sin(0.041*x + 0.55*time + z*0.11 + 2.1)
       + 0.22*Math.sin(0.31*x + 1.9*time + z*0.23);
}
function floorH(x,z){ return CFG.floorY + 1.4*Math.sin(0.045*x+z*0.05) + 0.9*Math.sin(0.09*x*0.7+z*0.11+3); }

// ---------- camera ----------
const cam = { x:0, y:4, z:0, shake:0, sx:0, sy:0 };
let FL = 900, fw=[1,0,0], rt=[0,0,1], up=[0,1,0], camUnder=false;
function setCamera(bird, dt){
  const back = CFG.camBack + bird.speed*0.055;
  const tx = bird.x - back;
  const under = bird.y < waveH(bird.x,0)-0.2;
  const ty = bird.y + (under? 0.9 : CFG.camUp);
  cam.x += (tx-cam.x)*Math.min(1, 8*dt);
  cam.y += (ty-cam.y)*Math.min(1, (under?7.5:4.2)*dt);
  cam.y = Math.max(cam.y, floorH(cam.x,0)+1.2);
  if(!REDUCED && cam.shake>0.01){
    cam.sx = (hash(time*61.7)-.5)*cam.shake; cam.sy = (hash(time*47.3)-.5)*cam.shake;
  } else { cam.sx=0; cam.sy=0; }
  cam.shake *= Math.pow(0.001, dt);
  const look = [bird.x+10, bird.y*0.9 + cam.y*0.1 + (under?-0.5:0.6), 0];
  fw = norm3([look[0]-cam.x, look[1]-(cam.y+cam.sy), look[2]-(cam.z+cam.sx)]);
  rt = norm3(cross(fw,[0,1,0]));
  up = cross(rt,fw);
  FL = H*0.86 * (1 - clamp(bird.speed,0,70)*0.0022);
  camUnder = (cam.y+cam.sy) < waveH(cam.x,0)-0.15;
}
const P=[0,0,0];
function project(x,y,z,out){
  const dx=x-cam.x, dy=y-(cam.y+cam.sy), dz=z-(cam.z+cam.sx);
  const cz = dx*fw[0]+dy*fw[1]+dz*fw[2];
  if(cz<0.45) return false;
  const s=FL/cz;
  out[0]=W2+(dx*rt[0]+dy*rt[1]+dz*rt[2])*s;
  out[1]=H2-(dx*up[0]+dy*up[1]+dz*up[2])*s;
  out[2]=cz;
  return true;
}

// ---------- light ----------
let L=[0.7,0.6,0.3], sunScreen=null, moonScreen=null;
function setLight(){
  const el = PAL.el, elL = Math.max(el, 0.28);
  L = norm3([Math.cos(elL)*0.92, Math.sin(elL), 0.30*Math.cos(elL)]);
  const sdir = norm3([Math.cos(el)*0.92, Math.sin(el), 0.30*Math.cos(el)]);
  const o=[0,0,0];
  sunScreen = project(cam.x+sdir[0]*1500, cam.y+sdir[1]*1500, sdir[2]*1500, o) ? [o[0],o[1]] : null;
  const m=[0,0,0];
  moonScreen = PAL.starA>0.35 && project(cam.x+1300, cam.y+Math.sin(0.72)*1500, -420, m) ? [m[0],m[1]] : null;
}
function shade(n, base, f){ // n normal, f extra brightness
  const d = Math.abs(n[0]*L[0]+n[1]*L[1]+n[2]*L[2]);
  const s = PAL.amb + (1-PAL.amb)*d;
  return shadeCol(base, s*(f||1));
}
function triN(a,b,c){ return norm3(cross([b[0]-a[0],b[1]-a[1],b[2]-a[2]],[c[0]-a[0],c[1]-a[1],c[2]-a[2]])); }

// ---------- painter list ----------
let items=[];
function push(d, fn){ items.push({d, fn}); }
function flushItems(){
  items.sort((a,b)=> b.d-a.d);
  for(let i=0;i<items.length;i++) items[i].fn();
  items.length=0;
}
const A=[0,0,0],B=[0,0,0],C=[0,0,0],D=[0,0,0];
function tri2(a,b,c,col,alpha){
  if(!project(a[0],a[1],a[2],A)||!project(b[0],b[1],b[2],B)||!project(c[0],c[1],c[2],C)) return;
  ctx.globalAlpha = alpha===undefined?1:alpha;
  ctx.fillStyle = css(col);
  ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

// ============================================================
//  BIRD
// ============================================================
const bird = {
  x:0, y:6, vx:16, vy:0, speed:16, ang:0,
  pitch:0, roll:0, flapT:0, fold:0.2, under:false, prevUnder:false,
  flapCd:0, skipChain:0,
};
function resetBird(){
  bird.x=0; bird.y=7; bird.vx=17; bird.vy=0; bird.speed=17; bird.ang=0;
  bird.pitch=0; bird.roll=0; bird.flapT=0; bird.fold=0.2;
  bird.under=false; bird.prevUnder=false; bird.flapCd=0; bird.skipChain=0;
  cam.x=bird.x-CFG.camBack; cam.y=bird.y+CFG.camUp; cam.shake=0;
}
const WHITE=[246,250,252], SHADOW=[196,214,226], BUFF=[247,224,166],
      DARKTIP=[26,36,46], CORAL=[255,122,69];
// body vertices (local: +X fwd, +Y up, +Z right)
const BV = {
  N:[0.95,0.04,0], HT:[0.42,0.24,0], BK:[-0.15,0.28,0], TL:[-1.05,0.14,0],
  BF:[0.38,-0.14,0], BB:[-0.40,-0.12,0],
  SL:[0.12,0.05,-0.24], SR:[0.12,0.05,0.24], RL:[-0.55,0.06,-0.16], RR:[-0.55,0.06,0.16],
  BEAK:[1.38,-0.03,0], NB1:[0.88,0.12,-0.075], NB2:[0.88,0.12,0.075], NB3:[0.9,-0.07,0],
  T1:[-1.28,0.16,-0.24], T2:[-1.28,0.16,0.24],
};
const BODY_TRIS = [
  ['N','HT','SL',BUFF], ['N','SR','HT',BUFF],
  ['HT','BK','SL',WHITE], ['HT','SR','BK',WHITE],
  ['BK','RL','SL',WHITE], ['BK','RR','SR',WHITE],
  ['BK','TL','RL',WHITE], ['BK','TL','RR',WHITE],
  ['N','SL','BF',SHADOW], ['N','BF','SR',SHADOW],
  ['SL','BB','BF',SHADOW], ['SR','BF','BB',SHADOW],
  ['SL','RL','BB',SHADOW], ['SR','BB','RR',SHADOW],
  ['RL','TL','BB',SHADOW], ['RR','BB','TL',SHADOW],
  ['BEAK','NB1','NB2',CORAL], ['BEAK','NB1','NB3',CORAL], ['BEAK','NB2','NB3',CORAL],
  ['TL','T1','T2',DARKTIP],
];
function birdVerts(){
  // wing pose
  const flap = Math.sin(bird.flapT);
  const f = bird.fold;                       // 0 spread … 1 tucked
  const ext = 1-0.62*f, sweep = -0.72*f;
  const wy1 = (0.28 + flap*0.5)*(1-f*0.8);
  const wy2 = (0.55 + Math.sin(bird.flapT-0.65)*0.98)*(1-f*0.8);
  const wing = (s)=>({
    SH :[0.30, 0.12, s*0.20],
    ST :[-0.30,0.10, s*0.24],
    MLd:[0.16+sweep*0.4, wy1, s*1.05*ext],
    MTr:[-0.46+sweep*0.4, wy1*0.94, s*1.0*ext],
    TIP:[-0.05+sweep, wy2, s*2.15*ext],
    TT :[-0.62+sweep, wy2*0.92, s*1.85*ext],
  });
  return {L:wing(-1), R:wing(1)};
}
function drawBird(){
  const cp=Math.cos(bird.pitch), sp=Math.sin(bird.pitch);
  const cr=Math.cos(bird.roll), sr=Math.sin(bird.roll);
  const SC = 1.35;
  const xf=(v)=>{
    let x=v[0]*SC, y=v[1]*SC, z=v[2]*SC;
    let y2=y*cr-z*sr, z2=y*sr+z*cr;          // roll
    let x3=x*cp-y2*sp, y3=x*sp+y2*cp;        // pitch
    return [bird.x+x3, bird.y+y3, z2];
  };
  const w=birdVerts();
  const tris=[];
  for(const t of BODY_TRIS) tris.push([xf(BV[t[0]]),xf(BV[t[1]]),xf(BV[t[2]]),t[3]]);
  for(const s of ['L','R']){
    const g=w[s];
    tris.push([xf(g.SH),xf(g.MLd),xf(g.ST),WHITE]);
    tris.push([xf(g.MLd),xf(g.MTr),xf(g.ST),WHITE]);
    tris.push([xf(g.MLd),xf(g.TIP),xf(g.MTr),DARKTIP]);
    tris.push([xf(g.TIP),xf(g.TT),xf(g.MTr),DARKTIP]);
  }
  // sort bird's own tris far→near
  tris.sort((a,b)=>{
    const da=(a[0][0]+a[1][0]+a[2][0])/3-cam.x, db=(b[0][0]+b[1][0]+b[2][0])/3-cam.x;
    return db-da;
  });
  for(const t of tris){
    const n=triN(t[0],t[1],t[2]);
    tri2(t[0],t[1],t[2], shade(n, t[3]));
  }
}

// ============================================================
//  DETERMINISTIC WORLD (slot functions)
// ============================================================
const collected = new Set();

// --- islands: one possible island per 170 m slot ---
function islandAt(s){
  const h1=hash(s*7.13); if(h1>0.72 || s<1) return null;
  const side = hash(s*3.7)<0.5?-1:1;
  const z = side*(40+120*hash(s*5.1));
  const x = s*170 + 140*hash(s*9.3);
  const r = 10+22*hash(s*11.7), ht = 7+17*hash(s*13.1);
  return {x,z,r,ht,seed:s};
}
function drawIsland(isl){
  const n=7, pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*TAU, rr=isl.r*(0.75+0.5*hash(isl.seed*31+i));
    pts.push([isl.x+Math.cos(a)*rr, -2.5, isl.z+Math.sin(a)*rr]);
  }
  const peak=[isl.x+isl.r*0.2*(hash(isl.seed*17)-0.5), isl.ht, isl.z+isl.r*0.2*(hash(isl.seed*19)-0.5)];
  const rock=[58,112,82], rock2=[92,128,88], sandC=PAL.sand;
  const d = isl.x-cam.x, fogF = (1-Math.exp(-Math.max(0,d)*0.0075))*0.72;
  for(let i=0;i<n;i++){
    const a=pts[i], b=pts[(i+1)%n];
    const nn=triN(peak,a,b);
    const base = hash(isl.seed*7+i)<0.5?rock:rock2;
    tri2(peak,a,b, mix(shade(nn,base), PAL.fog, fogF));
    // beach skirt
    const a2=[a[0]*1.12-isl.x*0.12, -2.5, a[2]*1.12-isl.z*0.12];
    const b2=[b[0]*1.12-isl.x*0.12, -2.5, b[2]*1.12-isl.z*0.12];
    const sn=triN(a,a2,b2);
    tri2(a,a2,b2, mix(shade(sn,sandC), PAL.fog, fogF));
    tri2(a,b2,b, mix(shade(sn,sandC), PAL.fog, fogF));
  }
  // palm on some islands
  if(hash(isl.seed*23)<0.55 && d<400){
    const px=isl.x+isl.r*0.1, pz=isl.z-isl.r*0.15, base=isl.ht*0.92;
    const top=[px+1.2, base+5, pz];
    tri2([px-0.35,base,pz],[px+0.35,base,pz],[top[0],top[1],top[2]], mix([96,78,52],PAL.fog,fogF));
    for(let i=0;i<5;i++){
      const a=i/5*TAU+isl.seed, fr=[top[0]+Math.cos(a)*3.4, top[1]+0.4-1.6*Math.abs(Math.sin(a*1.7)), top[2]+Math.sin(a)*3.4];
      tri2([top[0],top[1]+0.3,top[2]],[top[0],top[1]-0.25,top[2]],fr, mix([44,110,72],PAL.fog,fogF));
    }
  }
}

// --- clouds: slot per 95 m ---
function cloudAt(s){
  const h1=hash(s*4.77); if(h1>0.78) return null;
  return { x:s*95+90*hash(s*6.1), z:(hash(s*8.3)<0.5?-1:1)*(48+150*hash(s*2.9)),
           y:36+38*hash(s*5.9), sc:10+17*hash(s*3.3), seed:s };
}
function drawCloud(c){
  if(!project(c.x,c.y,c.z,A)) return;
  const s=FL/A[2]*c.sc;
  const d=c.x-cam.x, fogF=1-Math.exp(-Math.max(0,d)*0.004);
  const col=mix(mix(PAL.cloud,PAL.fog,0.25+fogF*0.55), PAL.skyHor, 0.28);
  ctx.globalAlpha=0.88;
  ctx.fillStyle=css(col);
  for(let i=0;i<6;i++){
    const ox=(hash(c.seed*13+i)-0.5)*3.4*s, oy=(hash(c.seed*17+i)-0.5)*0.42*s - i*0.03*s;
    const rr=s*(0.3+0.34*hash(c.seed*19+i));
    ctx.beginPath();
    for(let k=0;k<7;k++){
      const a=k/7*TAU+hash(c.seed+i)*2;
      const px=A[0]+ox+Math.cos(a)*rr*1.7, py=A[1]+oy+Math.sin(a)*rr*0.42;
      k?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// --- rings: slot per 210 m ---
function ringsAt(s){
  const h1=hash(s*15.31); if(h1>0.8 || s<1) return null;
  const n = 1+Math.floor(hash(s*3.7)*4);
  const x0 = s*210+120*hash(s*9.1);
  const y0 = 7+26*hash(s*6.7);
  const arc = (hash(s*4.9)-0.4)*10;
  const list=[];
  for(let i=0;i<n;i++){
    const t=n>1? i/(n-1)-0.5 : 0;
    list.push({id:'r'+s+'_'+i, x:x0+i*16, y:Math.max(4,y0 - arc*t*t*4 + arc*2*(0.25-t*t)), r:3});
  }
  return list;
}
function drawRing(rg, birdX){
  const bob = 0.35*Math.sin(time*1.6+rg.x*0.3);
  if(!project(rg.x,rg.y+bob,0,A)) return;
  const pr = FL/A[2]*rg.r;
  if(pr<1.5) return;
  const glow = clamp(1-(rg.x-birdX)/300, 0.4, 1);
  ctx.save();
  ctx.shadowColor='rgba(255,200,72,0.8)'; ctx.shadowBlur=pr*0.35;
  ctx.lineWidth = Math.max(2.5, pr*0.17);
  ctx.strokeStyle = css([255,200,72], 0.95*glow);
  ctx.beginPath(); ctx.ellipse(A[0],A[1],pr,pr*1.06,0,0,TAU); ctx.stroke();
  ctx.restore();
  ctx.lineWidth = Math.max(1.2, pr*0.055);
  ctx.strokeStyle = css([255,248,214], 0.9*glow);
  const a0 = time*2.2+rg.x;
  ctx.beginPath(); ctx.ellipse(A[0],A[1],pr,pr*1.06,0,a0,a0+1.1); ctx.stroke();
}

// --- fish schools: slot per 140 m ---
function fishAt(s){
  const h1=hash(s*21.7); if(h1>0.68 || s<1) return null;
  const n=5+Math.floor(hash(s*5.3)*5);
  const x0=s*140+70*hash(s*7.7), y0=-1.6-3.4*hash(s*3.1);
  const list=[];
  for(let i=0;i<n;i++){
    list.push({id:'f'+s+'_'+i, x:x0+(hash(s*11+i)-0.5)*9, y:y0+(hash(s*13+i)-0.5)*2.2, ph:hash(s+i)*TAU});
  }
  return list;
}
function drawFish(f, underCam){
  const wig = Math.sin(time*6+f.ph)*0.3;
  if(!project(f.x, f.y+wig*0.12, wig*0.5, A)) return;
  const s = FL/A[2]*0.55;
  if(s<1) return;
  ctx.globalAlpha = underCam?0.95:0.45;
  ctx.fillStyle = css([127,216,232]);
  ctx.beginPath();
  ctx.moveTo(A[0]+s, A[1]);
  ctx.lineTo(A[0]-s*0.5, A[1]-s*0.45);
  ctx.lineTo(A[0]-s*0.3, A[1]);
  ctx.lineTo(A[0]-s*0.5, A[1]+s*0.45);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = css([180,240,250]);
  ctx.beginPath();
  ctx.moveTo(A[0]-s*0.45,A[1]); ctx.lineTo(A[0]-s*1.1,A[1]-s*0.4); ctx.lineTo(A[0]-s*1.1,A[1]+s*0.4);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}

// ============================================================
//  PARTICLES + POPUPS
// ============================================================
const parts=[];
function spawn(type,x,y,z,vx,vy,vz,life,size){
  if(parts.length>340) parts.shift();
  parts.push({type,x,y,z,vx,vy,vz,life,t:0,size});
}
function splash(x, big, dir){
  const n = REDUCED? 8 : Math.min(26, 8+big*0.5);
  for(let i=0;i<n;i++){
    const a=hash(i*3.3+time)*TAU;
    spawn('drop', x+(hash(i+time)-.5)*1.5, waveH(x,0)+0.2, (hash(i*7+time)-.5)*1.5,
      Math.cos(a)*big*0.12+ (hash(i)-.3)*3, 3+hash(i*13+time)*big*0.28*dir, Math.sin(a)*big*0.12,
      0.7+hash(i)*0.5, 0.12+hash(i*31)*0.2);
  }
  spawn('foam', x, waveH(x,0)+0.05, 0, 0,0,0, 0.9, 0.5+big*0.05);
}
function bubbles(x,y,n){
  for(let i=0;i<n;i++)
    spawn('bub', x+(hash(i+time*7)-.5)*1.2, y+(hash(i*3+time)-.5)*1.2, (hash(i*9+time)-.5)*1.2,
      -1-hash(i)*2, 1.5+hash(i*5)*2, 0, 1.2+hash(i)*1, 0.08+hash(i*17)*0.12);
}
function burst(x,y){
  for(let i=0;i<14;i++){
    const a=i/14*TAU;
    spawn('spark', x, y, 0, Math.cos(a)*6, Math.sin(a)*6, (hash(i)-.5)*4, 0.55, 0.16);
  }
}
function stepParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>p.life){ parts.splice(i,1); continue; }
    if(p.type==='drop'){ p.vy-=22*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
      if(p.y<waveH(p.x,p.z)-0.4) p.life=0; }
    else if(p.type==='bub'){ p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.y>waveH(p.x,p.z)) p.life=0; }
    else if(p.type==='spark'){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt; p.vy-=6*dt; }
  }
}
function drawPart(p){
  const k=1-p.t/p.life;
  if(!project(p.x,p.y,p.z,A)) return;
  const s=FL/A[2];
  if(p.type==='drop'){ ctx.globalAlpha=k*0.9; ctx.fillStyle=css([234,247,250]);
    ctx.fillRect(A[0]-p.size*s/2, A[1]-p.size*s/2, p.size*s, p.size*s); }
  else if(p.type==='bub'){ ctx.globalAlpha=k*0.7; ctx.strokeStyle=css([200,240,250]); ctx.lineWidth=Math.max(1,s*0.02);
    ctx.beginPath(); ctx.arc(A[0],A[1],Math.max(1,p.size*s),0,TAU); ctx.stroke(); }
  else if(p.type==='spark'){ ctx.globalAlpha=k; ctx.fillStyle=css([255,220,120]);
    const r=Math.max(1.5,p.size*s);
    ctx.beginPath(); ctx.moveTo(A[0],A[1]-r); ctx.lineTo(A[0]+r,A[1]); ctx.lineTo(A[0],A[1]+r); ctx.lineTo(A[0]-r,A[1]);
    ctx.closePath(); ctx.fill(); }
  else if(p.type==='foam'){ ctx.globalAlpha=k*0.55; ctx.strokeStyle=css([240,250,252]); ctx.lineWidth=Math.max(1.5,s*0.05);
    const r=(0.6+p.t*4)*p.size*s*0.4;
    ctx.beginPath(); ctx.ellipse(A[0],A[1],r,r*0.32,0,0,TAU); ctx.stroke(); }
  ctx.globalAlpha=1;
}
const popups=[];
function popup(x,y,txt,col){ popups.push({x,y,txt,col,t:0}); }
function drawPopups(dt){
  ctx.textAlign='center';
  ctx.font = `700 ${Math.round(15*DPR)}px "Chakra Petch",sans-serif`;
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i]; p.t+=dt;
    if(p.t>1.25){ popups.splice(i,1); continue; }
    if(!project(p.x,p.y+p.t*2.4,0,A)) continue;
    ctx.globalAlpha = clamp(1.4-p.t,0,1);
    ctx.fillStyle = p.col;
    ctx.fillText(p.txt, A[0], A[1]);
  }
  ctx.globalAlpha=1;
}

// ============================================================
//  SKY + SEA RENDER
// ============================================================
const stars=[];
for(let i=0;i<140;i++) stars.push([hash(i*3.1), hash(i*7.7)*0.55, 0.6+hash(i*11.3)*1.4, hash(i*13)*TAU]);

function horizonY(){
  project(cam.x+2600, 0, 0, A); return A[1];
}
function drawSky(){
  const hy = clamp(horizonY(), H*0.15, H*0.9);
  const g = ctx.createLinearGradient(0,0,0,hy);
  g.addColorStop(0, css(PAL.skyTop));
  g.addColorStop(1, css(PAL.skyHor));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,hy+2);
  // stars
  if(PAL.starA>0.02){
    ctx.fillStyle=css([230,240,255]);
    for(const s of stars){
      const y=s[1]*hy*1.6; if(y>hy) continue;
      const tw=0.55+0.45*Math.sin(time*2+s[3]);
      ctx.globalAlpha=PAL.starA*tw*0.9;
      ctx.fillRect(s[0]*W, y, s[2]*DPR, s[2]*DPR);
    }
    ctx.globalAlpha=1;
  }
  // sun / moon
  const disc = (pos, col, r, glowR)=>{
    if(!pos) return;
    const gg=ctx.createRadialGradient(pos[0],pos[1],0,pos[0],pos[1],glowR);
    gg.addColorStop(0, css(col,0.85)); gg.addColorStop(1, css(col,0));
    ctx.fillStyle=gg; ctx.fillRect(pos[0]-glowR,pos[1]-glowR,glowR*2,glowR*2);
    ctx.fillStyle=css(col);
    ctx.beginPath(); ctx.arc(pos[0],pos[1],r,0,TAU); ctx.fill();
  };
  if(PAL.el>-0.05) disc(sunScreen, PAL.sun, H*0.045, H*0.3);
  if(moonScreen && PAL.starA>0.35) disc(moonScreen, [220,230,250], H*0.028, H*0.12);
  // fill everything below the horizon with far-sea colour so the mesh
  // never leaves gaps at the screen edges
  ctx.fillStyle=css(mix(PAL.seaHi,PAL.seaLo,0.9));
  ctx.fillRect(0,hy-1,W,H-hy+1);
  return hy;
}

// sea columns (fixed world z, denser at centre)
const COLS=[];
for(let i=-13;i<=13;i++){ const a=Math.abs(i); COLS.push(Math.sign(i)*(a*3.4+a*a*0.85)); }

function seaRows(){
  // returns array of row x-positions (world), snapped so waves don't crawl
  const rows=[];
  const x0=Math.floor((cam.x+2)/6)*6;
  for(let i=0;i<26;i++) rows.push(x0+i*6);
  const x1=Math.floor((cam.x+158)/22)*22;
  for(let i=0;i<9;i++) rows.push(Math.max(x1+i*22, rows[rows.length-1]+6));
  return rows;
}
function facet(pA,pB,pC, base, fogF, jit){
  if(!project(pA[0],pA[1],pA[2],A)||!project(pB[0],pB[1],pB[2],B)||!project(pC[0],pC[1],pC[2],C)) return;
  const n=triN(pA,pB,pC);
  const d=Math.abs(n[0]*L[0]+n[1]*L[1]+n[2]*L[2]);
  const s=(0.42+0.58*d*d)*jit;
  let col=shadeCol(base,s);
  col=mix(col, PAL.seaLo, fogF);
  const cs=css(col);
  ctx.fillStyle=cs; ctx.strokeStyle=cs; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]);
  ctx.closePath(); ctx.fill(); ctx.stroke();
}
function pushSea(birdUnder){
  const rows=seaRows();
  const alpha = (!camUnder && birdUnder)? 0.85 : 1;
  for(let r=0;r<rows.length-1;r++){
    const x0=rows[r], x1=rows[r+1];
    const dmid=(x0+x1)/2-cam.x;
    push(dmid, ()=>{
      const fogF = 1-Math.exp(-Math.max(0,dmid)*0.0075);
      ctx.globalAlpha=alpha;
      for(let c=0;c<COLS.length-1;c++){
        const z0=COLS[c], z1=COLS[c+1];
        const p00=[x0,waveH(x0,z0),z0], p01=[x0,waveH(x0,z1),z1],
              p10=[x1,waveH(x1,z0),z0], p11=[x1,waveH(x1,z1),z1];
        const j1=0.95+0.1*hash(x0*1.7+z0*3.1), j2=0.95+0.1*hash(x0*2.3+z1*1.9);
        if((c+r)&1){ facet(p00,p10,p01, PAL.seaHi, fogF, j1); facet(p01,p10,p11, PAL.seaHi, fogF, j2); }
        else       { facet(p00,p10,p11, PAL.seaHi, fogF, j1); facet(p00,p11,p01, PAL.seaHi, fogF, j2); }
      }
      ctx.globalAlpha=1;
    });
  }
  // sun-glitter: small screen-space sparkles on the water along the light path
  if(PAL.el>-0.05) push(0.6, ()=>{
    ctx.fillStyle=css(PAL.glint);
    for(let i=0;i<46;i++){
      const h1=hash(i*17.3), h2=hash(i*9.1), h3=hash(i*5.7+Math.floor(time*3));
      if(h3<0.45) continue;
      const gx=cam.x+30+h1*h1*260;
      const gz=(h2-0.5)*(14+ (gx-cam.x)*0.30);
      if(!project(gx, waveH(gx,gz)+0.08, gz, A)) continue;
      const sz=clamp(FL/A[2]*0.55,1,3.5)*(0.6+0.8*h3);
      ctx.globalAlpha=0.5*h3;
      ctx.fillRect(A[0]-sz/2, A[1]-sz/2, sz, sz);
    }
    ctx.globalAlpha=1;
  });
}

// ---- underwater ----
function drawUnderBG(){
  const depth=clamp((waveH(cam.x,0)-cam.y)/24,0,1);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, css(mix(PAL.uwTop,PAL.uwBot,depth*0.7)));
  g.addColorStop(1, css(PAL.uwBot));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // god rays
  if(sunScreen && PAL.el>-0.1){
    ctx.save();
    for(let i=0;i<6;i++){
      const a=(i/6-0.5)*1.5 + Math.sin(time*0.3+i)*0.06;
      ctx.globalAlpha=0.05+0.03*Math.sin(time*0.7+i*2);
      ctx.fillStyle=css(PAL.sun);
      ctx.beginPath();
      ctx.moveTo(sunScreen[0], Math.min(sunScreen[1],0));
      ctx.lineTo(sunScreen[0]+Math.sin(a)*H*2-W*0.05, H*2);
      ctx.lineTo(sunScreen[0]+Math.sin(a)*H*2+W*0.05, H*2);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha=1;
  }
}
function pushUnderSurface(){
  const rows=seaRows();
  for(let r=0;r<Math.min(rows.length-1,20);r++){
    const x0=rows[r], x1=rows[r+1], dmid=(x0+x1)/2-cam.x;
    push(dmid, ()=>{
      const fogF=1-Math.exp(-Math.max(0.1,dmid)*0.022);
      for(let c=4;c<COLS.length-5;c++){
        const z0=COLS[c], z1=COLS[c+1];
        const p00=[x0,waveH(x0,z0),z0], p01=[x0,waveH(x0,z1),z1],
              p10=[x1,waveH(x1,z0),z0], p11=[x1,waveH(x1,z1),z1];
        if(!project(p00[0],p00[1],p00[2],A)||!project(p01[0],p01[1],p01[2],B)||
           !project(p11[0],p11[1],p11[2],C)||!project(p10[0],p10[1],p10[2],D)) continue;
        const n=triN(p00,p10,p01);
        let col=shade(n, PAL.surfB, 1.32);
        col=mix(col, PAL.uwTop, fogF);
        const cs=css(col);
        ctx.globalAlpha=0.94;
        ctx.fillStyle=cs; ctx.strokeStyle=cs; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.lineTo(D[0],D[1]);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.globalAlpha=1;
      }
    });
  }
}
function pushSeabed(){
  const x0b=Math.floor((cam.x-10)/8)*8;
  for(let r=0;r<14;r++){
    const x0=x0b+r*8, x1=x0+8, dmid=(x0+x1)/2-cam.x;
    push(dmid+0.5, ()=>{
      const fogF=1-Math.exp(-Math.max(0.1,dmid+12)*0.030);
      if(fogF>0.96) return;
      for(let c=4;c<COLS.length-5;c++){
        const z0=COLS[c], z1=COLS[c+1];
        const p00=[x0,floorH(x0,z0),z0], p01=[x0,floorH(x0,z1),z1],
              p10=[x1,floorH(x1,z0),z0], p11=[x1,floorH(x1,z1),z1];
        if(!project(p00[0],p00[1],p00[2],A)||!project(p01[0],p01[1],p01[2],B)||
           !project(p11[0],p11[1],p11[2],C)||!project(p10[0],p10[1],p10[2],D)) continue;
        const n=triN(p00,p10,p01);
        let col=shade(n,PAL.sand,0.8);
        col=mix(col, PAL.uwBot, fogF);
        const cs=css(col);
        ctx.fillStyle=cs; ctx.strokeStyle=cs; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.lineTo(D[0],D[1]);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    });
  }
}

// bird shadow on the water
function pushShadow(){
  if(bird.under || bird.y>16) return;
  const sy=waveH(bird.x,0);
  push(bird.x-cam.x+0.2, ()=>{
    if(!project(bird.x,sy+0.06,0,A)) return;
    const s=FL/A[2];
    const al=clamp(0.35-(bird.y-sy)*0.02,0.05,0.3);
    ctx.globalAlpha=al; ctx.fillStyle=css([8,26,38]);
    ctx.beginPath(); ctx.ellipse(A[0],A[1],s*1.7,s*0.4,0,0,TAU); ctx.fill();
    ctx.globalAlpha=1;
  });
}

// speed streaks (screen space)
function drawStreaks(){
  if(REDUCED || bird.under) return;
  const k=clamp((bird.speed-36)/26,0,1);
  if(k<=0) return;
  ctx.globalAlpha=k*0.35; ctx.strokeStyle=css([240,250,255]); ctx.lineWidth=1.4*DPR;
  for(let i=0;i<10;i++){
    const yy=(hash(i*7.3+Math.floor(time*9))*H);
    const xx=(hash(i*3.9+Math.floor(time*9))*W);
    const len=(22+58*hash(i))*DPR*k;
    ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx-len,yy+len*0.05); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

// ============================================================
//  AUDIO
// ============================================================
let AC=null, master=null, windGain=null, windFilt=null, uwGain=null, muted=false;
function initAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted?0:0.5; master.connect(AC.destination);
    const len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    // wind
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    windFilt=AC.createBiquadFilter(); windFilt.type='lowpass'; windFilt.frequency.value=400;
    windGain=AC.createGain(); windGain.gain.value=0;
    src.connect(windFilt); windFilt.connect(windGain); windGain.connect(master); src.start();
    // underwater bed
    const src2=AC.createBufferSource(); src2.buffer=buf; src2.loop=true;
    const f2=AC.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=130;
    uwGain=AC.createGain(); uwGain.gain.value=0;
    src2.connect(f2); f2.connect(uwGain); uwGain.connect(master); src2.start();
  }catch(e){ AC=null; }
}
function sfxNoise(dur, f0, f1, vol, type){
  if(!AC) return;
  const len=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type=type||'lowpass';
  f.frequency.setValueAtTime(f0,AC.currentTime);
  f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),AC.currentTime+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
function sfxTone(freqs, dur, vol){
  if(!AC) return;
  freqs.forEach((fr,i)=>{
    const o=AC.createOscillator(); o.type='sine'; o.frequency.value=fr;
    const g=AC.createGain();
    const t0=AC.currentTime+i*0.07;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.05);
  });
}
const S = {
  flap : ()=> sfxNoise(0.13, 900, 300, 0.25, 'bandpass'),
  splashIn : (sp)=> sfxNoise(0.4, 2400, 300, clamp(sp/60,0.15,0.6)),
  splashOut: ()=> sfxNoise(0.28, 1400, 3400, 0.3, 'highpass'),
  skip : ()=> sfxNoise(0.14, 1800, 700, 0.28),
  ring : ()=> sfxTone([880,1318.5], 0.5, 0.22),
  fish : ()=> sfxTone([660], 0.18, 0.16),
  mile : ()=> sfxTone([523,659,784], 0.55, 0.2),
};
function audioFrame(){
  if(!AC) return;
  const uw = bird.under?1:0;
  const wind = clamp((bird.speed-12)/55,0,1)*(1-uw);
  windGain.gain.setTargetAtTime(wind*0.35, AC.currentTime, 0.1);
  windFilt.frequency.setTargetAtTime(300+bird.speed*28, AC.currentTime, 0.1);
  uwGain.gain.setTargetAtTime(uw*0.4, AC.currentTime, 0.15);
}

// ============================================================
//  INPUT
// ============================================================
let holding=false, holdTitle=false;
function press(){ initAudio(); if(AC&&AC.state==='suspended')AC.resume(); holding=true; if(state==='title') startGame(); }
function release(){ holding=false; }
addEventListener('pointerdown', e=>{ if(e.target.closest('button'))return; press(); });
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('keydown', e=>{
  if(e.repeat) return;
  if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); press(); }
  else if(e.code==='KeyM') toggleMute();
  else if(e.code==='KeyR') restart();
});
addEventListener('keyup', e=>{ if(e.code==='Space'||e.code==='ArrowUp') release(); });
addEventListener('blur', release);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) release(); });

// ============================================================
//  HUD + STATE
// ============================================================
const $=id=>document.getElementById(id);
const elHud=$('hud'), elTitle=$('title'), elDist=$('dist-n'), elSpeed=$('speed-n'),
      elFill=$('speedfill'), elBest=$('best-n'), elRing=$('ring-n'), elFish=$('fish-n'),
      elToast=$('toast'), elHint=$('hint'), elTitleBest=$('titlebest');
const fmt = n=> String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
let best=0;
try{ best = +localStorage.getItem('swoop-best')||0; }catch(e){}
function saveBest(){ try{ localStorage.setItem('swoop-best', String(best)); }catch(e){} }
if(best>0){ elBest.textContent=fmt(best); elTitleBest.textContent='BEST FLIGHT '+fmt(best)+' M'; }

let state='title', dist=0, rings=0, fishEaten=0, nextMile=500;
const hintsDone={};
let hintTimer=0;
function showHint(key, html, dur){
  if(hintsDone[key]) return; hintsDone[key]=true;
  elHint.innerHTML=html; elHint.classList.add('show'); hintTimer=dur||3.4;
}
function toast(txt){
  elToast.textContent=txt;
  elToast.classList.remove('show'); void elToast.offsetWidth;
  elToast.classList.add('show');
}
function toggleMute(){
  muted=!muted;
  if(master) master.gain.value=muted?0:0.5;
  document.querySelectorAll('.snd-on').forEach(p=>p.style.display=muted?'none':'');
  document.querySelector('.snd-off').style.display=muted?'':'none';
}
$('btn-mute').addEventListener('click', e=>{ e.stopPropagation(); initAudio(); toggleMute(); });
$('btn-restart').addEventListener('click', e=>{ e.stopPropagation(); restart(); });
function restart(){
  collected.clear(); parts.length=0; popups.length=0;
  resetBird(); dist=0; rings=0; fishEaten=0; nextMile=500;
  elRing.textContent='0'; elFish.textContent='0';
  if(state!=='play'){ state='play'; elHud.classList.add('on'); elTitle.classList.add('off'); }
}
function startGame(){
  restart();
  showHint('flap','<b>HOLD</b> to flap &amp; climb', 3.2);
}

// ============================================================
//  PHYSICS
// ============================================================
function physics(dt){
  // virtual autopilot on title screen (porpoising demo)
  let hold = holding;
  if(state==='title'){
    if(bird.under) hold = Math.atan2(bird.vy,bird.vx) < 1.15;
    else hold = (bird.y < 4.5+2*Math.sin(time*0.35) && bird.vy < 4);
    holdTitle = hold;
  }
  const wh = waveH(bird.x,0);
  bird.prevUnder = bird.under;
  bird.under = bird.y < wh;
  const sp = Math.hypot(bird.vx,bird.vy);
  bird.speed = sp;
  let ang = Math.atan2(bird.vy,bird.vx);

  if(bird.under){
    // ---- WATER: Ecco physics ----
    const depth = wh-bird.y;
    const grip = clamp(sp/11,0.15,1);
    if(hold){ if(ang < 1.36) ang += CFG.turnWaterUp*grip*dt; }
    else    { if(ang > -1.4) ang -= CFG.turnWaterDn*grip*dt; }
    let ns = sp;
    if(hold && ns<CFG.kickMax) ns += CFG.kick*dt;
    const drag = CFG.waterDrag*(1+Math.max(0,depth-7)*CFG.depthDrag);
    ns -= drag*ns*ns*dt;
    bird.vx = Math.cos(ang)*ns; bird.vy = Math.sin(ang)*ns;
    bird.vy += CFG.buoy*dt - CFG.g*dt*0.12;
    if(hold && hash(Math.floor(time*9))>0.5) bubbles(bird.x-0.5,bird.y,1);
    if(bird.y < floorH(bird.x,0)+0.7){ bird.y=floorH(bird.x,0)+0.7; if(bird.vy<0)bird.vy=0; }
  } else {
    // ---- AIR ----
    const grip = clamp(sp/26,0,1);
    if(hold){
      if(ang < 0.9) ang += CFG.turnAirUp*grip*dt;
      const ns=sp;
      bird.vx=Math.cos(ang)*ns; bird.vy=Math.sin(ang)*ns;
      bird.flapCd -= dt;
      if(bird.flapCd<=0){
        bird.flapCd = CFG.flapCd;
        const power = clamp(1.35 - sp/46, 0.12, 1)
                    * clamp(1 - bird.vy/13, 0.15, 1)
                    * clamp(1 - (bird.y-42)/26, 0.12, 1);
        bird.vy += CFG.flapVy*power;
        bird.vx += CFG.flapVx*power;
        const na=Math.atan2(bird.vy,bird.vx);
        if(na>1.02){ const s2=Math.hypot(bird.vx,bird.vy);
          bird.vx=Math.cos(1.02)*s2; bird.vy=Math.sin(1.02)*s2; }
        S.flap();
      }
    } else {
      if(ang > -1.42 && bird.vy<0) ang -= CFG.turnAirDn*grip*dt;
      const ns=sp;
      bird.vx=Math.cos(ang)*ns; bird.vy=Math.sin(ang)*ns;
      bird.flapCd = 0;
    }
    bird.vy -= CFG.g*dt;
    const dr = CFG.airDrag*sp;
    bird.vx -= dr*bird.vx*dt; bird.vy -= dr*bird.vy*dt;
    if(bird.vx < CFG.minCruise) bird.vx += (CFG.minCruise-bird.vx)*1.6*dt;
    const cap=CFG.maxAir;
    if(sp>cap){ bird.vx*=cap/sp; bird.vy*=cap/sp; }
  }

  bird.x += bird.vx*dt;
  bird.y += bird.vy*dt;

  // ---- surface crossings ----
  const nowUnder = bird.y < waveH(bird.x,0);
  if(nowUnder && !bird.prevUnder && !bird.under){ /* handled next frame */ }
  if(nowUnder && !bird.prevUnder){
    const entryAng=Math.atan2(bird.vy,bird.vx);
    if(entryAng > -CFG.skipAngle && bird.speed > CFG.skipSpeed && !hold){
      // stone-skip!
      bird.y = waveH(bird.x,0)+0.06;
      bird.vy = Math.abs(bird.vy)*0.62+1.6;
      bird.vx *= 0.94;
      bird.skipChain++;
      splash(bird.x, bird.speed*0.7, 1); S.skip();
      if(bird.skipChain>=2 && state==='play') popup(bird.x,bird.y+2.5,'SKIP ×'+bird.skipChain,'#FFC848');
      cam.shake += 0.15;
    } else {
      bird.vx*=CFG.entryKeep; bird.vy*=CFG.entryKeep;
      splash(bird.x, bird.speed, 1); S.splashIn(bird.speed);
      cam.shake += clamp(bird.speed*0.012,0.1,0.5);
      bird.skipChain=0;
      if(state==='play') showHint('swoop','<b>HOLD</b> to swoop back out of the sea!',3.2);
    }
  }
  if(!nowUnder && bird.prevUnder){
    bird.vx*=CFG.exitBoost; bird.vy*=CFG.exitBoost;
    splash(bird.x, bird.speed, 1); S.splashOut();
    if(bird.speed>27 && state==='play') popup(bird.x, bird.y+2.5, 'SWOOP +','#EAF7FA');
    bird.skipChain=0;
  }
  bird.under = bird.y < waveH(bird.x,0);

  // pose
  const tAng=Math.atan2(bird.vy,bird.vx);
  bird.pitch += (tAng-bird.pitch)*Math.min(1,10*dt);
  bird.roll = Math.sin(time*1.7)*0.05 + (hold&&!bird.under? Math.sin(bird.flapT)*0.06:0);
  const foldT = bird.under? 0.85 : (!hold && bird.vy<-4 ? clamp(-bird.pitch,0,1)*0.95 : 0.12);
  bird.fold += (foldT-bird.fold)*Math.min(1,6*dt);
  if(!bird.under && hold) bird.flapT += dt*11*clamp(1.5-sp/40,0.4,1.2);
  else if(!bird.under) bird.flapT += dt*2.2;   // slow idle
  // trail on water when skimming
  if(!bird.under && bird.y-wh<1.2 && bird.speed>18 && hash(Math.floor(time*30))>0.4)
    spawn('foam', bird.x, wh+0.03, 0, 0,0,0, 0.5, 0.25);

  // ---- gameplay events ----
  if(state!=='play') return;
  dist = Math.max(dist, bird.x);
  if(dist>=nextMile){ toast(fmt(nextMile)+' M'); S.mile(); nextMile+=500; }
  if(dist>best){ best=Math.floor(dist); elBest.textContent=fmt(best); }
  // hints
  if(bird.y>13) showHint('dive','<b>RELEASE</b> to dive for speed',3.2);
  if(bird.speed>34 && dist>250) showHint('chain','Chain dives to fly faster ✦',3);

  // rings
  const s0=Math.floor((bird.x-40)/210), s1=Math.floor((bird.x+40)/210);
  for(let s=s0;s<=s1;s++){
    const list=ringsAt(s); if(!list) continue;
    for(const rg of list){
      if(collected.has(rg.id)) continue;
      if(prevX<rg.x && bird.x>=rg.x && Math.abs(bird.y-rg.y)<2.9){
        collected.add(rg.id); rings++; elRing.textContent=rings;
        const boost=clamp(6, 0, CFG.maxAir-bird.speed);
        const an=Math.atan2(bird.vy,bird.vx);
        bird.vx+=Math.cos(an)*boost; bird.vy+=Math.sin(an)*boost;
        burst(rg.x,rg.y); S.ring(); popup(rg.x,rg.y,'+RING','#FFC848');
      }
    }
  }
  // fish
  if(bird.under){
    const f0=Math.floor((bird.x-20)/140), f1=Math.floor((bird.x+20)/140);
    for(let s=f0;s<=f1;s++){
      const list=fishAt(s); if(!list) continue;
      for(const f of list){
        if(collected.has(f.id)) continue;
        if(Math.abs(bird.x-f.x)<2.4 && Math.abs(bird.y-f.y)<1.8){
          collected.add(f.id); fishEaten++; elFish.textContent=fishEaten;
          const an=Math.atan2(bird.vy,bird.vx);
          bird.vx+=Math.cos(an)*3.5; bird.vy+=Math.sin(an)*3.5;
          bubbles(f.x,f.y,5); S.fish(); popup(f.x,f.y,'+FISH','#7FD8E8');
        }
      }
    }
  }
  // prune collected set occasionally
  if(collected.size>900){
    const arr=[...collected]; collected.clear();
    for(let i=arr.length-450;i<arr.length;i++) collected.add(arr[i]);
  }
}
let prevX=0;

// ============================================================
//  MAIN LOOP
// ============================================================
let last=0, acc=0, hudAcc=0, flash=0, fpsN=0, fpsT=0;
window.__game = { get fps(){return __fps;}, get bird(){return bird;}, get state(){return state;}, get dist(){return dist;} };
let __fps=0;

function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  if(dt>0.05) dt=0.05;
  time+=dt;
  fpsN++; fpsT+=dt; if(fpsT>=0.5){ __fps=fpsN/fpsT; fpsN=0; fpsT=0; }

  // physics (2 substeps)
  prevX=bird.x;
  const wasUnder=bird.under;
  physics(dt/2); physics(dt/2);
  if(wasUnder!==bird.under) flash=REDUCED?0.12:0.3;
  stepParts(dt);
  setCamera(bird,dt);

  // palette by distance (time of day)
  const tod=((state==='play'?dist:time*14)/2600)%4;
  const i0=Math.floor(tod)%4, i1=(i0+1)%4;
  mixPal(PALS[i0],PALS[i1],smooth(tod-Math.floor(tod)));
  setLight();
  audioFrame();

  // ---------- render ----------
  ctx.clearRect(0,0,W,H);
  if(!camUnder){
    const hy=drawSky();
    // clouds behind sea
    const c0=Math.floor(cam.x/95), c1=c0+8;
    for(let s=c1;s>=c0;s--){ const c=cloudAt(s); if(c) drawCloud(c); }
    pushSea(bird.under);
    // islands
    const is0=Math.floor(cam.x/170), is1=is0+3;
    for(let s=is0;s<=is1;s++){ const isl=islandAt(s); if(isl) push(isl.x-cam.x, ()=>drawIsland(isl)); }
    pushShadow();
  } else {
    drawUnderBG();
    pushSeabed();
    pushUnderSurface();
  }
  // rings
  {
    const s0=Math.floor(cam.x/210), s1=s0+3;
    for(let s=s1;s>=s0;s--){
      const list=ringsAt(s); if(!list) continue;
      for(const rg of list){ if(!collected.has(rg.id)) push(rg.x-cam.x, ()=>drawRing(rg,bird.x)); }
    }
  }
  // fish
  {
    const s0=Math.floor((cam.x-20)/140), s1=s0+2;
    for(let s=s1;s>=s0;s--){
      const list=fishAt(s); if(!list) continue;
      for(const f of list){ if(!collected.has(f.id)) push(f.x-cam.x, ()=>drawFish(f,camUnder)); }
    }
  }
  // bird + particles
  push(bird.x-cam.x, drawBird);
  for(const p of parts) push(p.x-cam.x, ()=>drawPart(p));
  flushItems();
  drawStreaks();
  drawPopups(dt);

  // splash flash + vignette
  if(flash>0.01){
    ctx.globalAlpha=flash; ctx.fillStyle='#EAF7FA'; ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1; flash*=Math.pow(0.0005,dt);
  }
  const vg=ctx.createRadialGradient(W2,H2,Math.min(W,H)*0.45,W2,H2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(4,16,26,0)');
  vg.addColorStop(1, camUnder?'rgba(2,10,20,0.5)':'rgba(4,16,26,0.28)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // ---------- HUD ----------
  hudAcc+=dt;
  if(hudAcc>0.1 && state==='play'){
    hudAcc=0;
    elDist.textContent=fmt(dist);
    elSpeed.textContent=Math.round(bird.speed*3.6)+' km/h';
    elFill.style.width=clamp(bird.speed/CFG.maxAir*100,0,100)+'%';
  }
  if(hintTimer>0){ hintTimer-=dt; if(hintTimer<=0) elHint.classList.remove('show'); }
}
resetBird();
requestAnimationFrame(frame);
</script>
